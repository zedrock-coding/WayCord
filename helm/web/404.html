<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Waycord</title>
  <meta name="description" content="The page you requested could not be found on Waycord.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"/>
  <meta name="theme-color" content="#111417">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111417;
      color: #E1E2E6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background-color: #191C1F;
      border: 1px solid #404943;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background-color: rgba(255, 82, 82, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF5252;
    }
    .badge-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      color: #E1E2E6;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #C0C9C2;
      margin-bottom: 16px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #8A938C;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #88C0A4;
      color: #1E2124;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #9ECBB5;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The destination you requested was not found or has moved. Return to the workspace to continue.</p>
    <a href="/" class="btn">Return to Workspace</a>
  </main>
</body>
</html>

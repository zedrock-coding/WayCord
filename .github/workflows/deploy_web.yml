name: Deploy Helm Web to Vercel

# Deploy only after the Quality Gate has passed for the same commit.
#
# `needs:` cannot reference a job in another workflow file, so the dependency is
# expressed with `workflow_run` instead: this workflow fires when "Quality Gate"
# finishes, and the job below refuses to run unless it concluded successfully.
on:
  push:
    branches: [highest, main]
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
    branches: [highest, main]
  workflow_dispatch:

# Never deploy two builds of the same commit at once, and never cancel one that
# is already uploading.
concurrency:
  group: deploy-web-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 1. Check out the commit that passed the gate. On workflow_run the
      #    default ref is the base branch, so the SHA must be explicit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 2. Install Flutter (pinned to the SDK the gate and pubspec.lock use)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      # 3. Build the Flutter Workspace App (/app)
      - name: Build Flutter Web Workspace
        working-directory: ./helm
        run: |
          flutter pub get
          flutter build web --release -O4 --base-href "/app/" --pwa-strategy=none --source-maps
          # Clean dangling source map references from vendor JS for Lighthouse compliance
          sed -i 's|//# sourceMappingURL=flutter.js.map||g' build/web/*.js || true

      # 4. Setup Node.js for Marketing & Billing Portal (/)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: waycord-web/package-lock.json

      # 5. Build Unified Portal Bundle
      - name: Build Unified Web Portal
        working-directory: ./waycord-web
        run: |
          npm ci
          # Stage Flutter SPA into public/app so Vite bundler copies it into dist/client/app
          mkdir -p public/app
          cp -r ../helm/build/web/* public/app/
          npm run build

      # 6. Fail the deploy if a credential ever reaches the client bundle
      - name: Verify no secrets in client bundle
        run: |
          set -euo pipefail
          if [ -e helm/build/web/assets/.env ]; then
            echo "::error::helm/build/web/assets/.env exists — the .env asset came back."
            exit 1
          fi
          found=0
          # Assembled from concatenated literals so this workflow file does not
          # match the same scan quality.yml runs over the source tree.
          pattern='AI''za[0-9A-Za-z_-]{20,}'
          pattern="$pattern|service_"'role'
          pattern="$pattern|sb_"'secret_[0-9A-Za-z_-]{20,}'
          while IFS= read -r file; do
            found=1
            echo "  $file"
          done < <(grep -rIlE "$pattern" waycord-web/dist/client helm/build/web || true)
          if [ "$found" -eq 1 ]; then
            echo "::error::A credential-like string was found in client bundles."
            exit 1
          fi
          if [ -e helm/build/web/admin.html ]; then
            echo "::error::admin.html is being deployed again."
            exit 1
          fi

      # 7. Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 8. Deploy Unified Application to Vercel
      - name: Deploy to Vercel
        working-directory: ./waycord-web
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: |
          mkdir -p .vercel
          if [ -f ../helm/.vercel/project.json ]; then
            cp ../helm/.vercel/project.json .vercel/project.json
          elif [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > .vercel/project.json
          fi
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
